<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ElectroQuest · Studio aset</title><link rel="stylesheet" href="preview.css"><body><header><span>ELECTROQUEST / MISI 01</span><h1>Gerbang Muatan</h1><p>Studio aset · animasi, alpha, dan komponen arena</p></header><main><section><h2>Karakter</h2><div class="controls"><label>Animasi <select id="animation"></select></label><button id="play">Pause</button><button id="step">Langkah frame</button><button id="restart">Ulang</button><label>FPS <input id="fps" type="number" min="1" max="60" value="6"></label><label>Skala <select id="scale"><option value="1">1×</option><option selected value="2">2×</option><option value="4">4×</option></select></label><label>Latar <select id="background"><option value="checker">Checkerboard</option><option value="white">Putih</option><option value="dark">Gelap</option></select></label><label><input type="checkbox" id="guides" checked> Baseline & batas</label></div><div id="stage" class="checker"><canvas id="sprite"></canvas></div><output id="info" aria-live="polite"></output></section><section><h2>Komposisi arena · 640 × 360</h2><p>Panel bergerak melalui kode. Tanda +/− dan panah ditambahkan saat render.</p><div class="arena-wrap"><canvas id="arena" width="640" height="360"></canvas></div><label><input type="checkbox" id="motion" checked> Gerakkan panel & elektron</label><p><span class="positive">+ Positif · amber</span> <span class="negative">− Negatif · cyan</span></p></section><section><h2>Komponen mandiri</h2><div id="gallery"></div></section></main><script type="module" src="preview.js"></script></body></html>
